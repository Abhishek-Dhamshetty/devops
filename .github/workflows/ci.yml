name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend lint when configured
        shell: bash
        run: |
          if node --input-type=module -e "import fs from 'node:fs'; const scripts = JSON.parse(fs.readFileSync('package.json', 'utf8')).scripts ?? {}; process.exit(scripts.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No backend lint script configured; skipping."
          fi

      - name: Run backend tests when configured
        shell: bash
        run: |
          if node --input-type=module -e "import fs from 'node:fs'; const command = JSON.parse(fs.readFileSync('package.json', 'utf8')).scripts?.test ?? ''; process.exit(command && !command.includes('no test specified') ? 0 : 1)"; then
            npm test
          else
            echo "No meaningful backend test script configured; skipping."
          fi
