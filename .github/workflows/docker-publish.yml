name: Publish Docker images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish-backend:
    name: Publish backend image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/abhishek-dhamshetty/devops-backend:latest
            ghcr.io/abhishek-dhamshetty/devops-backend:${{ github.sha }}

  publish-frontend:
    name: Publish frontend image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=http://localhost:5001/api
          push: true
          tags: |
            ghcr.io/abhishek-dhamshetty/devops-frontend:latest
            ghcr.io/abhishek-dhamshetty/devops-frontend:${{ github.sha }}
